<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}easy_ViTPose{% endblock %}</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --border: #e4e7ec;
    --border-soft: #edeff2;
    --text: #14161a;
    --muted: #667085;
    --accent: #2955d6;
    --accent-hover: #2247bd;
    --accent-soft: rgba(41,85,214,0.07);
    --ok: #12805c;
    --err: #c0392b;
    --shadow-sm: 0 1px 2px rgba(16,24,40,0.04);
    --shadow-md: 0 2px 8px rgba(16,24,40,0.06), 0 1px 2px rgba(16,24,40,0.04);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 940px;
    margin: 0 auto;
    padding: 32px 20px 64px;
  }
  h1 { font-size: 1.3rem; font-weight: 700; margin: 0 0 2px; letter-spacing: -0.01em; }
  h2 { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; }
  h3 { font-size: 0.95rem; font-weight: 700; margin: 22px 0 10px; color: var(--text); }
  h3:first-child { margin-top: 0; }
  .subtitle { color: var(--muted); margin-top: 0; margin-bottom: 24px; font-size: 0.9rem; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 26px;
    box-shadow: var(--shadow-sm);
  }
  label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  select, input[type=file] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fafbfc;
    color: var(--text);
    font-size: 0.9rem;
    font-family: inherit;
  }
  select:focus, input[type=file]:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .field { margin-bottom: 16px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.88rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn.secondary {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn.secondary:hover { background: var(--border-soft); }
  .error {
    background: rgba(192,57,43,0.06);
    border: 1px solid rgba(192,57,43,0.25);
    color: var(--err);
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 0.88rem;
  }
  .drop {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 28px;
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border-soft); }
  th { color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.02em; }
  tbody tr:hover { background: #fafbfc; }
  .badge {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 4px 11px;
    border-radius: 999px;
    font-size: 0.76rem;
    font-weight: 600;
  }
  .person-block {
    margin-top: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .person-block:first-child { margin-top: 0; }
  .person-header {
    background: var(--border-soft);
    padding: 9px 14px;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .scroll { max-height: 320px; overflow-y: auto; }
  img.result, video.result {
    width: 100%;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-top: 10px;
    display: block;
    background: #000;
  }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
  .stat {
    background: #fafbfc;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .stat b { display: block; font-size: 1.15rem; color: var(--text); font-weight: 700; }
  .actions { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border-soft); display: flex; gap: 10px; flex-wrap: wrap; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .media-grid { display: grid; grid-template-columns: 1fr; gap: 18px; align-items: start; }
  @media (min-width: 720px) {
    .media-grid.with-map { grid-template-columns: 1.6fr 1fr; }
  }

  details.raw {
    margin-top: 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--panel);
  }
  details.raw + details.raw { margin-top: 8px; }
  details.raw summary {
    cursor: pointer;
    padding: 11px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text);
    background: var(--border-soft);
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  details.raw summary::-webkit-details-marker { display: none; }
  details.raw summary::after {
    content: '+';
    font-size: 1rem;
    color: var(--muted);
    font-weight: 400;
  }
  details.raw[open] summary::after { content: '\2212'; }
  details.raw summary .hint { font-weight: 400; color: var(--muted); font-size: 0.78rem; }
  details.raw .raw-body { padding: 14px; }

  .site-header { margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  nav {
    display: flex;
    gap: 4px;
    margin-top: 18px;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--border);
  }
  nav a {
    padding: 10px 4px;
    margin-right: 22px;
    font-size: 0.87rem;
    font-weight: 600;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    transition: color 0.15s ease;
  }
  nav a:hover { color: var(--text); text-decoration: none; }
  nav a.active { color: var(--accent); border-bottom-color: var(--accent); }
  .quiz-q { margin-bottom: 22px; }
  .quiz-q p.q-text { font-weight: 600; margin-bottom: 10px; }
  .opt {
    display: block;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .opt:hover { background: var(--accent-soft); }
  .opt.correct { background: rgba(31,157,92,0.12); border-color: var(--ok); }
  .opt.wrong { background: rgba(255,90,90,0.12); border-color: #e35b5b; }
  .opt input { margin-right: 8px; }
  .explain {
    display: none;
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 6px;
    padding: 8px 12px;
    background: #fafbfc;
    border-radius: 6px;
  }
  .concept-box {
    background: #fafbfc;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin: 14px 0;
  }
  .pipeline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 20px 0; }
  .pipeline .step {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    text-align: center;
  }
  .pipeline .arrow { color: var(--muted); font-size: 1.1rem; }
  .progress-outer {
    width: 100%;
    height: 14px;
    background: #eef0f3;
    border-radius: 999px;
    overflow: hidden;
    margin-top: 20px;
  }
  .progress-inner {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #6fa3ff);
    border-radius: 999px;
    transition: width 0.4s ease;
  }
  .progress-label {
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 8px;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="site-header">
    <h1>easy_ViTPose</h1>
    <p class="subtitle" style="margin-bottom:0;">Pose estimation, deteksi shuttlecock, dan pelacakan posisi lapangan badminton.</p>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.path == url_for('index') else '' }}">Upload</a>
      <a href="{{ url_for('golfdb_page') }}" class="{{ 'active' if request.path.startswith('/golfdb') else '' }}">GolfDB</a>
    </nav>
  </div>
  {% block content %}{% endblock %}
</div>
</body>
</html>
